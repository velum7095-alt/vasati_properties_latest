# ------------------------------------------------------------------------------
# Vasati Properties — Docker Compose configuration
# ------------------------------------------------------------------------------

services:
  # 1. PostgreSQL 16 Database
  db:
    image: postgres:16-alpine
    container_name: bangalore_rera_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vasati_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vasati_properties}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dpdp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vasati_app} -d ${POSTGRES_DB:-vasati_properties}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Express application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bangalore_rera_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-vasati_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-vasati_properties}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dpdp_network

networks:
  dpdp_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
